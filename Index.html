<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><style>
*{box-sizing:border-box}body{margin:0;background:#11161c;color:#edf1f4;font:14px system-ui}.app{display:grid;grid-template-columns:280px 1fr;min-height:100vh}aside{padding:32px;border-right:1px solid #303943}main{padding:40px}h1{font:40px Georgia}.muted{color:#9eabb6}.week{margin:30px 0}.week h2{font-size:13px;letter-spacing:.14em;color:#8996a1}.lesson{display:grid;grid-template-columns:90px 1fr 220px;gap:20px;padding:20px;background:#1b222a;border:1px solid #303943;border-radius:14px;margin:10px 0}.lesson strong{font:22px Georgia}.lesson p{margin:5px 0;color:#aeb8c1}.tags{color:#9facb7}.nav div{padding:10px 0;border-bottom:1px solid #2a323b}@media(max-width:700px){.app{grid-template-columns:1fr}aside{display:none}.lesson{grid-template-columns:1fr}}</style></head>
<body><div class="app"><aside><small>COURSE MAP</small><h2 id="course"></h2><p class="muted" id="duration"></p><div class="nav"><div>Overview</div><div>Units</div><div>Lessons</div><div>Resources</div><div>Assessment</div></div></aside><main><small>LONG-RANGE PLANNER · PUBLIC DEMO</small><h1 id="unit">Loading…</h1><p class="muted">Structured curriculum data designed to feed planning and presentation views.</p><div id="plan"></div></main></div>
<script>google.script.run.withSuccessHandler(d=>{course.textContent=d.course.name;duration.textContent=d.course.durationMonths+'-month course model';unit.textContent='You are here: '+d.currentUnit;plan.innerHTML=d.weeks.map(w=>'<section class="week"><h2>'+w.label+'</h2>'+w.lessons.map(l=>'<article class="lesson"><span>'+l.day+'</span><div><strong>'+l.title+'</strong><p>'+l.objective+'</p></div><span class="tags">'+l.tags.join(' · ')+'</span></article>').join('')+'</section>').join('')}).getPlan();</script></body></html>
